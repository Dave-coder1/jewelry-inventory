<!DOCTYPE html>
<!-- Jewelry Inventory PWA. See JEWELRY-PWA-SPEC.md for the build spec. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Voski</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <header class="list-header">
    <div class="chips" id="chipsRow">
      <button class="chip chip-active" data-filter="all">All <span class="chip-count" id="allCount">8</span></button>
      <button class="chip" data-filter="bank">🏦 Bank <span class="chip-count" id="bankCount">0</span></button>
      <button class="chip" data-filter="home">🏠 Home <span class="chip-count" id="homeCount">0</span></button>
      <button class="icon-button" id="searchToggleButton" aria-label="Search">🔍</button>
      <button class="icon-button" id="overflowButton" aria-label="More options">⋮</button>
    </div>
    <div class="search-wrap" id="searchRow" hidden>
      <input type="text" class="search-input" id="searchInput" placeholder="Search">
      <button class="search-close" id="searchCloseButton" aria-label="Close search">✕</button>
    </div>
    <div class="backup-reminder" id="backupReminder" hidden>
      <span class="backup-reminder-text" id="backupReminderText"></span>
      <button class="backup-reminder-action" id="backupReminderAction">Back up now</button>
      <button class="backup-reminder-dismiss" id="backupReminderDismiss" aria-label="Dismiss">✕</button>
    </div>
  </header>

  <div class="table-scroll">
    <div class="table">
      <div class="row row-header">
        <div class="cell cell-code">ID</div>
        <div class="cell cell-photo1">Photo</div>
        <div class="cell cell-name">Name</div>
        <div class="cell cell-status">Where</div>
        <!-- Tap: toggle alphabetical sort. Long-press: open the custom
             type-filter picker (§11) — the funnel icon is a hint that a
             long-press does something more than the tap. -->
        <button class="cell cell-type cell-type-header" id="typeSortHeader">
          <span class="cell-type-label">Type</span>
          <svg class="type-filter-icon" id="typeFilterIcon" viewBox="0 0 16 14" aria-hidden="true" focusable="false">
            <path d="M1,1 L15,1 L9.5,7.5 L9.5,13 L6.5,13 L6.5,7.5 Z"></path>
          </svg>
          <span class="type-sort-arrow" id="typeSortArrow" hidden>▲</span>
        </button>
        <div class="cell cell-photo2">Box</div>
        <div class="cell cell-note">Note</div>
      </div>
      <div id="rows"></div>
    </div>
  </div>
  <div class="empty-state" id="emptyState" hidden></div>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-drag" id="sheetDrag">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="sheet-content">
      <div class="sheet-photos">
        <div class="sheet-photo" id="sheetPhoto1" data-slot="photo1">
          <span class="sheet-photo-icon">📷</span>
          <img class="sheet-photo-img" alt="" hidden>
          <div class="sheet-photo-spinner" hidden></div>
        </div>
        <div class="sheet-photo" id="sheetPhoto2" data-slot="photo2">
          <span class="sheet-photo-icon">📦</span>
          <img class="sheet-photo-img" alt="" hidden>
          <div class="sheet-photo-spinner" hidden></div>
        </div>
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Name</div>
        <input type="text" class="sheet-input" id="fieldName" maxlength="60" placeholder="Name">
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Type</div>
        <select class="sheet-select" id="fieldType"></select>
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Note</div>
        <textarea class="sheet-textarea" id="fieldNote" maxlength="120" rows="2"></textarea>
        <div class="sheet-note-count" id="noteCount">0 / 120</div>
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Code</div>
        <input type="text" class="sheet-input sheet-code-input" id="fieldCode" maxlength="2">
        <div class="sheet-error" id="codeError"></div>
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Status</div>
        <button class="sheet-status-pill" id="fieldStatus"></button>
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Move history</div>
        <div class="history-list" id="historyList"></div>
        <button class="sheet-add-entry" id="addEntry">Add entry</button>
      </div>

      <button class="sheet-delete" id="deleteItem">Delete item</button>
    </div>
  </div>

  <div class="backdrop" id="deletedBackdrop"></div>
  <div class="sheet sheet-deleted" id="deletedSheet">
    <div class="sheet-deleted-header">
      <div class="sheet-title">Recently deleted</div>
      <button class="sheet-done" id="deletedDone">Done</button>
    </div>
    <div class="sheet-content" id="deletedList"></div>
  </div>

  <!-- §9: long-press a sheet photo to replace or remove it -->
  <div class="backdrop" id="photoActionBackdrop"></div>
  <div class="action-sheet" id="photoActionSheet">
    <button class="action-sheet-btn" id="photoReplaceBtn">Replace photo</button>
    <button class="action-sheet-btn action-sheet-destructive" id="photoRemoveBtn">Remove photo</button>
    <button class="action-sheet-btn action-sheet-cancel" id="photoCancelBtn">Cancel</button>
  </div>

  <!-- §9: "Add entry" asks which direction the manual record is for, then
       stamps it with today's date (editable afterwards like any entry). -->
  <div class="backdrop" id="historyAddBackdrop"></div>
  <div class="action-sheet" id="historyAddSheet">
    <button class="action-sheet-btn" id="historyToBankBtn">🏦 To Bank</button>
    <button class="action-sheet-btn" id="historyToHomeBtn">🏠 To Home</button>
    <button class="action-sheet-btn action-sheet-cancel" id="historyAddCancelBtn">Cancel</button>
  </div>

  <!-- §11: long-press the "Type" column header — a custom single-select
       picker, deliberately not a native <select>, so there's no OS-added
       control chrome. JS inserts 1 button per type (plus "All types")
       before the Cancel button, and re-labels the currently-active one
       with a leading checkmark each time this opens. -->
  <div class="backdrop" id="typeFilterBackdrop"></div>
  <div class="action-sheet" id="typeFilterSheet">
    <div class="action-sheet-info">Filter by type</div>
    <button class="action-sheet-btn action-sheet-cancel" id="typeFilterCancelBtn">Cancel</button>
  </div>

  <!-- §10: full-screen photo viewer -->
  <div class="photo-viewer" id="photoViewer">
    <img class="photo-viewer-img" id="photoViewerImg" alt="">
  </div>

  <!-- Shared file picker for both photo slots. No `capture` attribute, so
       Android offers gallery and camera both (§10). -->
  <input type="file" accept="image/*" id="photoFileInput" hidden>

  <!-- The single "⋮" overflow menu: Add item and Recently deleted moved in
       here from their own top-bar buttons, alongside Back up / Restore. -->
  <div class="backdrop" id="overflowBackdrop"></div>
  <div class="action-sheet" id="overflowSheet">
    <div class="action-sheet-info" id="storageInfo">Using — · Last backup —</div>
    <button class="action-sheet-btn action-sheet-btn-icon" id="addItemBtn">
      <span class="action-sheet-icon">+</span> Add item
    </button>
    <button class="action-sheet-btn action-sheet-btn-icon" id="recentlyDeletedBtn">
      <span class="action-sheet-icon">🗑️</span> Recently deleted
    </button>
    <button class="action-sheet-btn action-sheet-btn-icon" id="backupBtn">
      <span class="action-sheet-icon">⬆️</span> Back up
    </button>
    <button class="action-sheet-btn action-sheet-btn-icon" id="restoreBtn">
      <span class="action-sheet-icon">⬇️</span> Restore from file
    </button>
    <button class="action-sheet-btn action-sheet-cancel" id="overflowCancelBtn">Cancel</button>
  </div>
  <input type="file" accept="application/json,.json" id="restoreFileInput" hidden>

  <!-- §13: shown while encoding/decoding photos for backup/restore — not
       dismissible, since there's nothing sensible to resume into partway. -->
  <div class="progress-overlay" id="progressOverlay">
    <div class="progress-card">
      <div class="progress-spinner"></div>
      <div class="progress-text" id="progressText"></div>
    </div>
  </div>

  <!-- §11: "Clear the filter to reorder." when a long-press-drag is
       attempted while search, a filter, or a Type sort is active. -->
  <div class="toast" id="toast"></div>

</div>
<script src="js/db.js"></script>
<script src="js/photos.js"></script>
<script src="js/backup.js"></script>
<script src="js/app.js"></script>
</body>
</html>
