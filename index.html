<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jewelry</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <header class="list-header">
    <div class="search-wrap">
      <input type="text" class="search-input" placeholder="Search" disabled>
    </div>
    <div class="chips">
      <button class="chip chip-active">All <span class="chip-count" id="allCount">8</span></button>
      <button class="chip">🏦 Bank <span class="chip-count">0</span></button>
      <button class="chip">🏠 Home <span class="chip-count">0</span></button>
      <button class="fab" id="addButton">+</button>
    </div>
  </header>

  <div class="table-scroll">
    <div class="table">
      <div class="row row-header">
        <div class="cell cell-code">ID</div>
        <div class="cell cell-photo1">Photo</div>
        <div class="cell cell-name">Name</div>
        <div class="cell cell-status">Where</div>
        <div class="cell cell-type">Type</div>
        <div class="cell cell-photo2">Box</div>
        <div class="cell cell-note">Note</div>
      </div>
      <div id="rows"></div>
    </div>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-drag" id="sheetDrag">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="sheet-content">
      <div class="sheet-photos">
        <div class="sheet-photo">📷</div>
        <div class="sheet-photo">📦</div>
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Name</div>
        <input type="text" class="sheet-input" id="fieldName" maxlength="60" placeholder="Name">
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Type</div>
        <select class="sheet-select" id="fieldType"></select>
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Note</div>
        <textarea class="sheet-textarea" id="fieldNote" maxlength="120" rows="2"></textarea>
        <div class="sheet-note-count" id="noteCount">0 / 120</div>
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Code</div>
        <input type="text" class="sheet-input sheet-code-input" id="fieldCode" maxlength="2">
        <div class="sheet-error" id="codeError"></div>
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Status</div>
        <button class="sheet-status-pill" id="fieldStatus" disabled></button>
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Move history</div>
        <div class="history-list" id="historyList"></div>
        <button class="sheet-add-entry" id="addEntry" disabled>Add entry</button>
      </div>

      <button class="sheet-delete" id="deleteItem">Delete item</button>
    </div>
  </div>

  <div class="backdrop" id="deletedBackdrop"></div>
  <div class="sheet sheet-deleted" id="deletedSheet">
    <div class="sheet-deleted-header">
      <div class="sheet-title">Recently deleted</div>
      <button class="sheet-done" id="deletedDone">Done</button>
    </div>
    <div class="sheet-content" id="deletedList"></div>
  </div>

</div>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
