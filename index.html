<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jewelry</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <header class="list-header">
    <div class="search-wrap">
      <input type="text" class="search-input" placeholder="Search" disabled>
    </div>
    <div class="chips">
      <button class="chip chip-active">All <span class="chip-count">8</span></button>
      <button class="chip">🏦 Bank <span class="chip-count">0</span></button>
      <button class="chip">🏠 Home <span class="chip-count">0</span></button>
      <button class="fab" disabled>+</button>
    </div>
  </header>

  <div class="table-scroll">
    <div class="table">
      <div class="row row-header">
        <div class="cell cell-code">ID</div>
        <div class="cell cell-photo1">Photo</div>
        <div class="cell cell-name">Name</div>
        <div class="cell cell-status">Where</div>
        <div class="cell cell-type">Type</div>
        <div class="cell cell-photo2">Box</div>
        <div class="cell cell-note">Note</div>
      </div>
      <div id="rows"></div>
    </div>
  </div>

</div>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
